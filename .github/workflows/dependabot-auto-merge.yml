# Auto-merge Dependabot PRs once CI is green, so dependency updates don't need a
# human. This runs *after* the CI workflow finishes (workflow_run), not during
# the PR itself, which means:
#   - it only ever fires once CI has actually completed, and
#   - it runs from the default branch with a token that honors the permissions
#     block below (Dependabot's own PR runs get a read-only token by default).
#
# We deliberately do NOT use branch protection + native auto-merge: that would
# require a required-status-check merge blocker on main, which would also block
# direct pushes to main. This keeps main unprotected while still gating merges
# on CI.
#
# Copied from robert-crandall/go-home-server, which is where this design was
# worked out, with two changes: the stale-base guard asks the API directly
# rather than depending on the payload's shape (an equivalent check, not a
# repair - see below), and there is a final `gh workflow run` step. Both are
# commented where they happen.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  # Only for the dispatch at the end.
  actions: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Serialize. Dependabot opens its PRs seconds apart - measured on the
    # foundation repo, three landed at 04:29:38Z, 04:30:08Z and 04:30:47Z - and
    # CI here takes ~3 minutes, so several auto-merge runs are in flight at once
    # and all of them clear the freshness check below before any of them merges.
    # Then each merges onto a main the others just moved, and the guard's promise
    # ("the squash lands exactly the tree CI validated") is false for all but the
    # first. --match-head-commit does not help: it pins the PR *head*, not the
    # base. In this repo that combination is then published and deployed without
    # CI ever running on it, because GITHUB_TOKEN merges don't trigger workflows.
    #
    # Serialized, the second run re-reads main after the first merged, sees
    # behind_by > 0, and declines. Cost: GitHub keeps one pending entry per
    # group, so with 3+ at once the middle ones are cancelled rather than
    # queued. Self-healing - Dependabot rebases onto the new main, CI runs
    # again, and this fires again.
    concurrency:
      group: dependabot-auto-merge
      cancel-in-progress: false
    # Only Dependabot PR runs, and only when every CI job passed. The actor is
    # the login that caused the CI run; a fork can't make that dependabot[bot],
    # so this is spoof-safe.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Squash-merge the passing Dependabot PR
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Dependabot is a GitHub App: filter with --app. Do NOT select on a
          # --json author.login - gh renders bot logins there as
          # "app/dependabot", so comparing it to the API's "dependabot[bot]"
          # (what the job `if:` above matches) finds nothing, and the step exits
          # 0 reporting "nothing to merge" while the run stays green. This file
          # shipped exactly that bug.
          #
          # --head matches on branch name alone, so .[0] is the first match,
          # not the only possible one.
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
                 --app dependabot --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR for $BRANCH; nothing to merge."
            exit 0
          fi

          # If main moved since CI ran, the combination CI tested is stale, and
          # merging it puts an untested tree on main - which, in this repo,
          # publishes an image and deploys it.
          #
          # The foundation reads the tested base from
          # github.event.workflow_run.pull_requests[0].base.sha, and that works:
          # on a real workflow_run.completed payload captured from this repo the
          # array holds one entry whose base.sha is main's tip exactly. The
          # array is populated while the PR is open and cleared once it closes,
          # and an auto-merge run is by definition the open case.
          #
          # This asks the same question a different way: does the PR head
          # already contain everything on main? If it does, the squash lands
          # exactly the tree CI validated. If it doesn't, main has commits the
          # tested merge never saw. One API call, no payload plumbing, and it
          # reads the same whether or not you know the payload's shape. It is an
          # equivalent check, not a repair of a broken one - reverting to the
          # foundation's base.sha comparison would lose nothing.
          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$HEAD_SHA" --jq .behind_by)
          if [ "$behind" != "0" ]; then
            echo "PR head is $behind commit(s) behind main; the merge CI tested is stale. Skipping - Dependabot rebases and CI runs again."
            exit 0
          fi

          # --match-head-commit refuses the merge if the PR head moved after CI
          # (Dependabot force-pushes on rebase), so we never merge an untested tip.
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA"

          echo "merged=true" >> "$GITHUB_OUTPUT"

      # The addition. GitHub does not create workflow runs for events triggered
      # by GITHUB_TOKEN, and the merge above is one - so a self-merged Dependabot
      # PR advances main without running CI, which means no `workflow_run`, which
      # means publish.yml never fires. Dependency updates would land in the repo
      # and never reach the homelab, silently and indefinitely.
      #
      # workflow_dispatch is one of the two documented exceptions to that rule,
      # which is why publish.yml carries the trigger. main's tip is the commit
      # that just merged, and trusting it is the same trust the merge above
      # already extended: CI passed on that head, and the staleness check above
      # proved main had not moved underneath it.
      #
      # Worst case if that GITHUB_TOKEN behaviour ever changes: a duplicate
      # publish of an identical digest. Wasteful, not wrong.
      - name: Publish the merged commit
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
